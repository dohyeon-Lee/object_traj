# Simulation-specific (simulation/main_abs.py)
steps: 1                        # MuJoCo steps per trajectory waypoint
control_freq: 50                # OSC control frequency (Hz)
show_eef: false                 # overlay EEF trail and axes on rendered frames
initial: false                   # anchor traj start (frame 0) to center instead of mean
dataset_cam_only: true          # only render dataset camera view (no robot visualization)
flat_output: true               # save {run_name}.mp4 directly into video_dir (no subfolder)
concat_order: [gt, megapose, foundpose, freepose, unihope, ours]  # horizontal concat order
label_overrides:             # display name overrides (folder name -> label)
  foundpose: foundationpose
concat_only: false            # true = skip simulations, only regenerate concat videos
show_labels: true            # show method name labels below each video column
cam_distance: 1                 # dataset camera distance multiplier (>1 = farther, <1 = closer)
use_proxddp: true            # use ProxDDP-optimized freepose trajectory (see config_proxddp.yml)

# Deploy-specific (deploy_franka/main.py)
tcp_offset: 0.145               # flange to gripper tip along flange Z (meters, Robotiq85)






















