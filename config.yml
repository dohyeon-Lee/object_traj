# Shared between simulation/main_abs.py and deploy_franka/main.py
# data/035_power_drill_20200709_151335
data_dir: data/pour_into_8625         # dataset to use (relative to project root)

angle: 0                    # camera-to-robot horizontal rotation (degrees)
elevation: 90               # camera vertical tilt (degrees, 0=horizontal, 90=top-down)
scale: 1.0                   # trajectory scale factor
eef_dir: mz # SPH_lat150lon0z0                  # gripper approach direction: mz / py / my / SPH_lat<a>lon<b>z<c>
center_offset: [0.0, 0.0, 0.0]  # offset added to EEF initial position (meters, robot frame)

# Simulation-specific (simulation/main_abs.py)
steps: 2                     # MuJoCo steps per trajectory waypoint
control_freq: 10             # OSC control frequency (Hz)
show_eef: true              # overlay EEF trail and axes on rendered frames

# Deploy-specific (deploy_franka/main.py)
tcp_offset: 0.145            # flange to gripper tip along flange Z (meters, Robotiq85)
