[project]
name = "object-traj"
version = "0.1.0"
description = "Franka Panda tabletop EEF trajectory simulation with robosuite"
requires-python = ">=3.10"
dependencies = [
    "robosuite>=1.4",
    "scipy>=1.11",
    "numpy>=1.24",
    "wandb>=0.17",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.4",
    "opencv-python-headless>=4.13.0.92",
    "matplotlib>=3.10.8",
    "plotly>=6.7.0",
]

[tool.uv]
# robosuite pulls in mujoco; make sure MUJOCO_GL=egl on headless servers
# Run: uv run python robosuite_eef_traj.py
